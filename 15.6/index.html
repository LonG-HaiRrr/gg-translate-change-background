<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Theo Dõi Cân Nặng | LonG HairRr</title>
    <link rel="stylesheet" href="style.css">
    <!-- Nhúng thư viện vẽ biểu đồ Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- HEADER & NAVIGATION TABS -->
    <header class="main-header">
        <div class="header-container">
            <a href="https://github.com/longhairrr" target="_blank" class="logo">LonG HairRr</a>
            <nav class="nav-tabs">
                <button class="tab-link active" onclick="openTab(event, 'TabNhapLieu')">Nhập Thông Tin</button>
                <button class="tab-link" onclick="openTab(event, 'TabXoa')">Yêu Cầu Xoá</button>
                <button class="tab-link" onclick="openTab(event, 'TabDanhSach')">Danh Sách Cân Nặng</button>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <!-- ================= TAB 1: NHẬP THÔNG TIN ================= -->
        <div id="TabNhapLieu" class="tab-content active">
            <div class="container">
                <h2>📊 Nhập Thông Tin Cân Nặng</h2>
                <div class="form-group">
                    <input type="text" id="maTk" placeholder="Mã tài khoản (VD: long)">
                    <input type="text" id="tenTk" placeholder="Tên (Có thể bỏ trống)">
                    <input type="number" id="canNang" placeholder="Cân nặng (kg)" step="0.1">
                    <button onclick="guiDuLieu()">Gửi số liệu</button>
                </div>
            </div>
            <div class="container charts-section">
                <h2>📈 Biểu Đồ Theo Dõi Toàn Thời Gian</h2>
                <div id="chartsContainer">
                    <!-- Các biểu đồ sẽ được tạo tự động bằng JS -->
                </div>
            </div>
        </div>

        <!-- ================= TAB 2: YÊU CẦU XOÁ ================= -->
        <div id="TabXoa" class="tab-content">
            <div class="container">
                <h2>❌ Yêu Cầu Xoá Dữ Liệu</h2>
                <div class="form-group">
                    <input type="text" id="maTkXoa" placeholder="Nhập mã tài khoản cần xoá">
                    <button class="btn-danger" onclick="yeuCauXoa()">Gửi yêu cầu xoá</button>
                </div>
            </div>
            <div class="container charts-section">
                <h2>📈 Biểu Đồ Theo Dõi Toàn Thời Gian</h2>
                <div id="chartsContainer">
                    <!-- Các biểu đồ sẽ được tạo tự động bằng JS -->
                </div>
            </div>
        </div>

        <!-- ================= TAB 3: DANH SÁCH & BIỂU ĐỒ ================= -->
        <div id="TabDanhSach" class="tab-content">
            <div class="container table-container">
                <h2>📋 Bảng Thống Kê</h2>
                <table>
                    <thead>
                        <tr>
                            <th rowspan="2">Tên hiển thị</th>
                            <th rowspan="2">Cân Nặng (kg)</th>
                            <th colspan="2" style="text-align: center;">Thời điểm cập nhật lần cuối</th>
                        </tr>
                        <tr>
                            <th>Giờ - Phút - Giây</th>
                            <th>Ngày</th>
                        </tr>
                    </thead>
                    <tbody id="dataBody">
                        <!-- Dữ liệu bảng sẽ được render tại đây -->
                    </tbody>
                </table>
            </div>

            <!-- Khu vực render biểu đồ cho từng người dùng -->
            <div class="container charts-section">
                <h2>📈 Biểu Đồ Theo Dõi Toàn Thời Gian</h2>
                <div id="chartsContainer">
                    <!-- Các biểu đồ sẽ được tạo tự động bằng JS -->
                </div>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
