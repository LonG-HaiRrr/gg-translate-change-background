<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Theo Dõi Cân Nặng</title>
    <style>
        /* Cấu hình giao diện Dark Mode */
        body { 
            font-family: Arial, sans-serif; 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 20px; 
            background-color: #121212; /* Nền tối chủ đạo */
            color: #e0e0e0;            /* Màu chữ sáng */
        }
        
        h2 {
            color: #ffffff;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .form-group { 
            margin-bottom: 15px; 
            display: flex;
            gap: 10px;
        }

        /* Tùy chỉnh các ô Input */
        input[type="text"], input[type="number"] {
            flex: 1;
            padding: 10px;
            background-color: #1e1e1e; /* Nền input tối hơn */
            border: 1px solid #444;      /* Viền xám mờ */
            border-radius: 4px;
            color: #ffffff;            /* Chữ trong input màu trắng */
            outline: none;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: #3b82f6;     /* Viền đổi sang xanh dương khi click vào */
        }

        /* Tùy chỉnh Nút bấm */
        button {
            padding: 10px 15px;
            background-color: #2563eb; /* Màu xanh dương hiện đại */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #1d4ed8; /* Tối hơn một chút khi hover */
        }

        hr {
            border: 0;
            height: 1px;
            background: #333;          /* Đường chia cắt mờ hơn */
            margin: 25px 0;
        }

        /* Tùy chỉnh Bảng dữ liệu */
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px; 
            background-color: #1e1e1e; /* Nền bảng tối */
            border-radius: 6px;
            overflow: hidden;
        }

        th, td { 
            padding: 12px; 
            text-align: left; 
        }

        th {
            background-color: #2a2a2a; /* Nền tiêu đề bảng */
            color: #3b82f6;            /* Chữ tiêu đề màu xanh để làm điểm nhấn */
            border-bottom: 2px solid #333;
        }

        td {
            border-bottom: 1px solid #2a2a2a;
            color: #cccccc;
        }

        /* Hiệu ứng đổi màu khi di chuột qua các hàng trong bảng */
        tr:hover td {
            background-color: #252525;
        }
    </style>
</head>
<body>

    <h2>📊 Nhập Thông Tin Cân Nặng</h2>
    <div class="form-group">
        <input type="text" id="maTk" placeholder="Nhập mã tài khoản (VD: user123)">
        <input type="number" id="canNang" placeholder="Nhập cân nặng (kg)">
        <button onclick="guiDuLieu()">Gửi số liệu</button>
    </div>

    <hr>

    <h2>❌ Yêu Cầu Xoá Dữ Liệu</h2>
    <div class="form-group">
        <input type="text" id="maTkXoa" placeholder="Nhập mã tài khoản cần xoá">
        <button onclick="yeuCauXoa()">Gửi yêu cầu xoá</button>
    </div>

    <hr>

    <h2>📋 Danh Sách Cân Nặng Hiện Tại</h2>
    <table id="balthi">
        <thead>
            <tr>
                <th>Mã Tài Khoản</th>
                <th>Cân Nặng (kg)</th>
                <th>Thời gian</th>
            </tr>
        </thead>
        <tbody id="dataBody">
            </tbody>
    </table>


    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzcIDOcWS1jgIEMReDpzlHEEIQLtEtoo_Y1_Xa3-WsgcFL0vUZ5OZ4NORXCpPcLbEQ_4g/exec";

        // Hàm gửi cân nặng
        async function guiDuLieu() {
            let maTk = document.getElementById('maTk').value;
            let canNang = document.getElementById('canNang').value;
            if(!maTk || !canNang) return alert("Vui lòng nhập đủ thông tin");

            await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "nhap_lieu", maTk, canNang })
            });
            alert("Đã cập nhật!");
            loadData();
        }

        // Hàm yêu cầu xoá
        async function yeuCauXoa() {
            let maTk = document.getElementById('maTkXoa').value;
            if(!maTk) return alert("Vui lòng nhập mã tài khoản");

            await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "yeu_cau_xoa", maTk })
            });
            alert("Đã gửi yêu cầu. Admin sẽ check và xoá sớm!");
        }

        // Hàm lấy dữ liệu về hiển thị
        async function loadData() {
            let res = await fetch(API_URL);
            let data = await res.json();
            let html = "";
            data.forEach(row => {
                html += `<tr><td>${row[0]}</td><td>${row[1]}</td><td>${new Date(row[2]).toLocaleDateString()}</td></tr>`;
            });
            document.getElementById('dataBody').innerHTML = html;
        }

        // Chạy hàm load dữ liệu khi vừa mở web
        loadData();
    </script>
</body>
</html>
